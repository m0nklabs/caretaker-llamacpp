[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caretaker"
version = "0.1.0"
description = "Per-GPU-host manager daemon owning the llama-server lifecycle behind a thin control API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
include = ["caretaker*"]

[tool.pytest.ini_options]
minversion = "9.1.1"
required_plugins = ["pytest-asyncio==1.4.0"]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests that hit a live llama-server (require a running backend)",
]

[tool.ruff]
required-version = "==0.16.5"
target-version = "py312"
line-length = 100
src = ["caretaker", "tests"]