[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caretaker"
version = "0.1.0"
description = "Per-GPU-host manager daemon owning the llama-server lifecycle behind a thin control API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "pyyaml",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["caretaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: tests that hit a live llama-server (require a running backend)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["caretaker", "tests"]