name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Python ${{ matrix.python-version }} checks
    runs-on: [self-hosted, Linux]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Prepare run-local environment path
        env:
          CHECK_PYTHON: ${{ matrix.python-version }}
        run: |
          # Resolve runner paths in a step: runner context is unavailable in job env.
          echo "CHECK_VENV=$RUNNER_TEMP/caretaker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$CHECK_PYTHON" >> "$GITHUB_ENV"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and pinned development tools
        run: |
          python -m venv "$CHECK_VENV"
          "$CHECK_VENV/bin/python" -m pip install -e '.[dev]'
      - name: Check dependency consistency
        run: '"$CHECK_VENV/bin/python" -m pip check'
      - name: Lint
        run: '"$CHECK_VENV/bin/python" -m ruff check caretaker tests'
      - name: Compile
        run: '"$CHECK_VENV/bin/python" -m compileall -q caretaker tests'
      - name: Test
        run: '"$CHECK_VENV/bin/python" -m pytest tests/ -q -p no:cacheprovider'
      - name: Remove run-local environment
        if: always()
        run: |
          if [ -z "${CHECK_VENV:-}" ]; then exit 0; fi
          case "$CHECK_VENV" in
            "$RUNNER_TEMP"/caretaker-*) rm -rf -- "$CHECK_VENV" ;;
            *) echo "Refusing unexpected environment path" >&2; exit 1 ;;
          esac
